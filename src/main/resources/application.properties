# ===============================
# Application Configuration
# ===============================

spring.application.name=SmartHouse
server.port=8080
server.servlet.context-path=/SmartHouse


# ===============================
# JSP Configuration
# ===============================

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/smarthouse_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root


# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Multipart File Upload
# ===============================

smarthouse.upload.directory=${user.dir}/uploads/properties

smarthouse.upload.max-size-bytes=5242880

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ===============================
# DevTools
# ===============================

spring.devtools.restart.enabled=true


# ===============================
# Initial Admin Account
# ===============================

smarthouse.admin.email=admin@smarthouse.com
smarthouse.admin.password=SmartAdmin@001


# ===============================
# Session Timeout
# ===============================

# Use 1 minute only for testing
server.servlet.session.timeout=15# ===============================
# Application Configuration
# ===============================

spring.application.name=SmartHouse
server.port=${PORT:8080}
server.servlet.context-path=/SmartHouse


# ===============================
# JSP Configuration
# ===============================

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarthouse_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Multipart File Upload
# ===============================

smarthouse.upload.directory=${UPLOAD_DIRECTORY:${user.dir}/uploads/properties}

smarthouse.upload.max-size-bytes=5242880

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# ===============================
# DevTools
# ===============================

spring.devtools.restart.enabled=false


# ===============================
# Initial Admin Account
# ===============================

smarthouse.admin.email=${ADMIN_EMAIL}
smarthouse.admin.password=${ADMIN_PASSWORD}


# ===============================
# Session Timeout
# ===============================

server.servlet.session.timeout=15m